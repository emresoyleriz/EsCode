name: One-time EsCode lockfile bootstrap
on:
  push:
    branches: ["feature/desktop-ui-hardening-v2"]
    paths: [".github/workflows/lockfile-bootstrap.yml"]
permissions:
  contents: write
jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/desktop-ui-hardening-v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate reproducible lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to feature branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build: pin transitive npm dependency tree"
          git push origin HEAD:refs/heads/feature/desktop-ui-hardening-v2
