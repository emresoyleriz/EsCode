name: EsCode Foundation CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Reproducible install
        run: npm ci --no-audit --no-fund
      - name: JavaScript syntax checks
        run: npm run check:syntax
      - name: State, contract and foundation tests
        run: npm test
      - name: Production bundle build
        run: npm run build
  windows-ui-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Reproducible install
        run: npm ci --no-audit --no-fund
      - name: JavaScript syntax checks
        run: npm run check:syntax
      - name: State, contract and foundation tests
        run: npm test
      - name: Production bundle build
        run: npm run build
  windows-ipc-spike:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Record SDK
        run: dotnet --info
      - name: Build .NET Host spike
        run: dotnet build src/host/EsCode.Host/EsCode.Host.csproj --configuration Release
      - name: Verify bounded named-pipe handshake
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --ipc-spike
      - name: Verify scoped tool grants
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --policy-spike
      - name: Verify workspace revision guard
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --revision-spike
      - name: Verify uncertain-outcome retry guard
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --recovery-spike
      - name: Verify fail-closed Tool Broker authorization
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --broker-policy-spike
      - name: Verify durable SQLite operation journal and restart recovery
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --journal-spike
      - name: Verify real crash kill-point SQLite journal recovery
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --journal-crash-spike
      - name: Verify denied digest-only reconciliation and future schema preservation
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --journal-safety-spike
      - name: Verify separate global/workspace journals and transactional migration rollback
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --journal-partitions-spike
      - name: Verify DPAPI encrypted unsaved-buffer recovery, migration and corruption refusal
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --session-checkpoint-spike
      - name: Verify SQLite page-quota exhaustion, killed open transaction and failed v1 migration
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --journal-fault-spike
      - name: Verify read-only workspace path and UTF-8 protections
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --workspace-read-spike
      - name: Verify multi-root workspace isolation and stale revision rejection
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --workspace-sessions-spike
      - name: Verify actual disk patch with exact-content, single-use trusted approval
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --workspace-approved-patch-spike
      - name: Verify supervised Git worktree creation and grant denial
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --git-worktree-spike
      - name: Verify bounded Git stdout/stderr and negative-output fixtures
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --git-output-guard-spike
      - name: Verify streamed OpenAI-compatible provider chat and failures
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --chat-spike
      - name: Verify authenticated read-only model catalog and bounded provider replies
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --model-catalog-spike
      - name: Verify plan-only durable agent run and failure transitions
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --agent-plan-spike
      - name: Verify durable dependency DAG, pause and fail-closed crash recovery
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --durable-task-dag-spike
      - name: Verify independent untrusted-plan reviewer cannot approve tools
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --plan-review-spike
      - name: Verify untrusted plugin manifest and denied execution policy
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --plugin-manifest-spike
      - name: Verify bounded read-only SQLite FTS codebase index and stale-hit denial
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --code-index-spike
      - name: Verify bounded C#/TS/Python/SQL symbols, context and freshness
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --symbol-index-spike
      - name: Verify Windows Job Object containment
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --worker-containment-spike
      - name: Verify suspend-before-Job-assignment lifecycle (harmless child only)
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --suspended-worker-spike
      - name: Verify disposable Windows AppContainer profile and SID lifecycle
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --appcontainer-profile-spike
      - name: Verify suspended zero-capability AppContainer child token, SID and Job Object
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --appcontainer-launch-spike
      - name: Verify AppContainer file, loopback and child-process denial with positive controls
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --appcontainer-adversarial-spike
      - name: Verify real Node to .NET Host IPC with negative scenarios
        run: node --test tests/windows/ipc-host.test.mjs
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Fail on high or critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high
  visual-screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Reproducible install
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local preview
        run: |
          npm run dev -- --host 127.0.0.1 > vite.log 2>&1 &
          sleep 5
      - name: Capture screenshots and verify navigation
        run: npm run visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: escode-ui-visual-screenshots
          path: |
            artifacts/visual/
            vite.log
          retention-days: 7
