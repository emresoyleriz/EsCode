name: EsCode Foundation CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Reproducible install
        run: npm ci --no-audit --no-fund
      - name: JavaScript syntax checks
        run: npm run check:syntax
      - name: State, contract and foundation tests
        run: npm test
      - name: Production bundle build
        run: npm run build
  windows-ui-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Reproducible install
        run: npm ci --no-audit --no-fund
      - name: JavaScript syntax checks
        run: npm run check:syntax
      - name: State, contract and foundation tests
        run: npm test
      - name: Production bundle build
        run: npm run build
  windows-ipc-spike:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Record SDK
        run: dotnet --info
      - name: Build .NET Host spike
        run: dotnet build src/host/EsCode.Host/EsCode.Host.csproj --configuration Release
      - name: Verify bounded named-pipe handshake
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --ipc-spike
      - name: Verify scoped tool grants
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --policy-spike
      - name: Verify workspace revision guard
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --revision-spike
      - name: Verify uncertain-outcome retry guard
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --recovery-spike
      - name: Verify fail-closed Tool Broker authorization
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --broker-policy-spike
      - name: Verify durable SQLite operation journal and restart recovery
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --journal-spike
      - name: Verify read-only workspace path and UTF-8 protections
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --workspace-read-spike
      - name: Verify Windows Job Object containment
        run: dotnet run --project src/host/EsCode.Host/EsCode.Host.csproj --configuration Release --no-build -- --worker-containment-spike
      - name: Verify real Node to .NET Host IPC with negative scenarios
        run: node --test tests/windows/ipc-host.test.mjs
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Fail on high or critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high
  visual-screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Reproducible install
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local preview
        run: |
          npm run dev -- --host 127.0.0.1 > vite.log 2>&1 &
          sleep 5
      - name: Capture screenshots and verify navigation
        run: npm run visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: escode-ui-visual-screenshots
          path: |
            artifacts/visual/
            vite.log
          retention-days: 7
